name: Feature
description: A change to routing, supervision, packs, or docs
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would fix it. Headless and local-first stay load-bearing.
    validations:
      required: true

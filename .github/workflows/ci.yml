name: xx-stack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  layout:
    name: Layout, Agent Sync & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify component layouts
        run: npm run layout:verify

      - name: Verify VS Code agent mirrors are in sync
        run: npm run agents:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  mcp-server:
    name: MCP Server (build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm --prefix xx-stack/mcp-server test

  design-pack:
    name: Design Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate design catalog
        run: npm run design:catalog

      - name: Fail if the catalog is stale
        run: git diff --exit-code -- xx-stack/packs/design/DESIGN-CATALOG.md

      - name: Run golden task checks
        run: npm run design:golden

  hermes:
    name: Hermes Control Plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run orchestrator tests
        working-directory: hermes-orchestration
        run: python3 -m unittest discover -s tests -v

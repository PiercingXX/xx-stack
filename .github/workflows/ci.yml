name: xx-stack CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  checks:
    name: Layout, Agent Sync, Lint, Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify repository layout
        run: node scripts/verify-repo-layout.mjs

      - name: Verify VS Code agent mirrors are in sync
        run: node scripts/sync-vscode-agents.mjs --check

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

  mcp-server-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run MCP server tests
        run: npm --prefix mcp-server test

  design-pack:
    name: Design Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate design catalog
        run: npm --prefix mcp-server run design-pack:catalog

      - name: Run golden task checks
        run: npm --prefix mcp-server run design-pack:golden

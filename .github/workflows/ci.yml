name: xx-stack CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  layout:
    name: Layout, Agent Sync & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify component layouts
        run: npm run layout:verify

      - name: Verify VS Code agent mirrors are in sync
        run: npm run agents:check

      - name: Verify generated registries match inventory.json
        run: npm run inventory:check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  mcp-server:
    # Matrix covers the lowest supported version (package.json engines) and
    # current LTS. Node's test-runner glob handling differs across majors, so
    # testing only one version hides real breakage.
    name: MCP Server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm --prefix xx-stack/mcp-server test

  design-pack:
    name: Design Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate design catalog
        run: npm run design:catalog

      - name: Fail if the catalog is stale
        run: git diff --exit-code -- xx-stack/packs/design/DESIGN-CATALOG.md

      - name: Run golden task checks
        run: npm run design:golden

      # Structural gate over every HTML template and example in the design
      # pack. Generic gates only in sweep mode; the per-skill acceptance
      # profiles run when an agent invokes it with --skill on its own output.
      - name: Run HTML quality gate
        run: npm run design:html-gate

  hermes:
    name: Hermes Control Plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run orchestrator tests
        working-directory: hermes-orchestration
        run: python3 -m unittest discover -s tests -v
